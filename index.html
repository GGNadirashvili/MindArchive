<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="MindArchive: a searchable space of thinkers' quotes and thoughts from every era and tradition. Filter by category, sort by country." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet" />
    <title>MindArchive: the space of human thought</title>
  </head>
  <body>
    <!-- Shown until the app mounts; if the app fails to load or start, it explains why instead of a blank page. -->
    <div id="root">
      <p id="boot-fallback" style="color:#8f8f8f;font:13px/1.6 ui-monospace,Menlo,monospace;padding:40px 24px;max-width:640px;margin:0 auto">Opening the archive…</p>
    </div>
    <noscript><p style="color:#f4f4f4;font:15px system-ui;padding:24px">MindArchive needs JavaScript to run.</p></noscript>
    <script>
      (function () {
        function show(msg) {
          var el = document.getElementById('boot-fallback')
          if (el) el.textContent = 'MindArchive could not start: ' + msg + '. Try a hard refresh (Cmd/Ctrl + Shift + R), or open it in a private window.'
        }
        // capture = true also catches scripts/stylesheets that fail to download (e.g. a stale cached page)
        window.addEventListener('error', function (e) {
          var t = e.target
          show(t && (t.src || t.href) ? 'could not load ' + (t.src || t.href) : e.message || 'unknown error')
        }, true)
        window.addEventListener('unhandledrejection', function (e) {
          show((e.reason && e.reason.message) || String(e.reason))
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
